[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402-aa-wallet"
version = "0.3.1"
description = "Give an ERC-4337 / account-abstraction agent a dedicated, non-custodial EOA so it can pay x402 (HTTP 402) challenges against any x402 merchant — smart-wallet signatures don't yet settle on today's facilitators. Optional max_amount_usd spend cap."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MeMikko" }]
maintainers = [{ name = "MeMikko" }]
keywords = [
  "x402",
  "account-abstraction",
  "erc-4337",
  "smart-wallet",
  "agent",
  "ai-agent",
  "eip-3009",
  "base",
  "wallet",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "requests>=2.31.0",
  "eth-account>=0.14.0",
  "x402[requests,evm]>=2.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "responses>=0.25.0"]

[project.urls]
Homepage = "https://github.com/MeMikko/x402-aa-wallet-py#readme"
Documentation = "https://github.com/MeMikko/x402-aa-wallet-py#readme"
Repository = "https://github.com/MeMikko/x402-aa-wallet-py"
Issues = "https://github.com/MeMikko/x402-aa-wallet-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_aa_wallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
